<title>Inter-Department Sports Festival</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a scoreboard header band, tab bar, then one working panel per tab (form left, roster right; stacks on phones). */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #141b2b;
  --muted: #5b6577;
  --line: #dce1ea;
  --accent: #e2531b;       /* running-track clay */
  --accent-ink: #ffffff;
  --lane: #1f3a68;         /* lane-line navy for the header */
  --lane-ink: #f3f6fb;
  --ok: #1d7a4a; --ok-bg: #e3f4ea;
  --warn: #9a5b00; --warn-bg: #fdf0d9;
  --bad: #b3261e; --bad-bg: #fbe4e2;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141d; --surface: #171e2b; --ink: #e8ecf3; --muted: #9aa5b8; --line: #2a3445;
  --accent: #ff7a45; --accent-ink: #1a0d06; --lane: #142542; --lane-ink: #e8ecf3;
  --ok: #6fd39c; --ok-bg: #12301f; --warn: #f2bf62; --warn-bg: #33270f; --bad: #ff8a80; --bad-bg: #3a1714;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141d; --surface: #171e2b; --ink: #e8ecf3; --muted: #9aa5b8; --line: #2a3445;
  --accent: #ff7a45; --accent-ink: #1a0d06; --lane: #142542; --lane-ink: #e8ecf3;
  --ok: #6fd39c; --ok-bg: #12301f; --warn: #f2bf62; --warn-bg: #33270f; --bad: #ff8a80; --bad-bg: #3a1714;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }

header.band { background: var(--lane); color: var(--lane-ink);
  background-image: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), rgba(255,255,255,.08) calc(25% - 1px) 25%); }
header.band .wrap { padding-block: 22px 18px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
header.band .eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 11px; opacity: .8; }
header.band h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 800; line-height: 1; text-transform: uppercase; }
header.band h1 span { color: var(--accent); }
.mode { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,.25); }
.mode::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.mode.cloud { color: #8fe0b0; } .mode.local { color: #f7c977; } .mode.wait { color: #c9d3e6; }

nav.tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button { font: 600 15px var(--font-display); text-transform: uppercase; letter-spacing: .06em; background: none; border: 0; color: var(--muted);
  padding: 12px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-family: var(--font-body); font-size: 11px; color: var(--muted); margin-left: 4px; }

main { padding-block: 20px 48px; }
.notice { padding: 10px 12px; border-radius: var(--r); background: var(--warn-bg); color: var(--warn); margin-bottom: 16px; }
.notice[data-kind="ok"] { background: var(--ok-bg); color: var(--ok); }
.notice[data-kind="bad"] { background: var(--bad-bg); color: var(--bad); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

.split { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel h2 { font-size: 22px; text-transform: uppercase; margin-bottom: 12px; }
.panel h2 small { font: 400 13px var(--font-body); color: var(--muted); text-transform: none; margin-left: 6px; }

form { display: grid; gap: 10px; }
label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
input, select { font: 400 14px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; width: 100%; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; margin: 0; }
legend { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 0 4px; }
.checks { display: grid; gap: 4px; max-height: 220px; overflow-y: auto; }
.checks label { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 14px; color: var(--ink); }
.checks input { width: auto; }
.checks .q { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.checks label.full { color: var(--muted); }

.btns { display: flex; flex-wrap: wrap; gap: 8px; }
button.btn { font: 600 14px var(--font-body); border-radius: var(--r); padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.btn.small { padding: 4px 10px; font-size: 12px; }
button.btn.danger { color: var(--bad); }
button.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }
button.btn:disabled { opacity: .5; cursor: not-allowed; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.toolbar > * { flex: 1 1 160px; width: auto; }
.toolbar .btn { flex: 0 0 auto; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 12px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
td.num, th.num { text-align: center; }
.bib { font: 700 15px var(--font-display); letter-spacing: .04em; background: var(--ink); color: var(--bg); padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); margin: 1px 2px 1px 0; white-space: nowrap; }
.pill { display: inline-block; white-space: nowrap; min-width: 44px; text-align: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.full { background: var(--warn-bg); color: var(--warn); }
.pill.over { background: var(--bad-bg); color: var(--bad); }
.muted { color: var(--muted); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }
.sport-type { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.actions { white-space: nowrap; text-align: right; }

@media (max-width: 820px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) { button.btn { transition: background .15s, color .15s; } }
</style>

<header class="band">
  <div class="wrap">
    <div>
      <div class="eyebrow">Festival desk</div>
      <h1>Inter-Department <span>Sports</span> Festival</h1>
    </div>
    <div id="mode" class="mode wait">Connecting…</div>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button role="tab" data-tab="overview">Overview</button>
    <button role="tab" data-tab="sports">Sports<span class="count" id="c-sports"></span></button>
    <button role="tab" data-tab="players">Players<span class="count" id="c-players"></span></button>
    <button role="tab" data-tab="departments">Departments<span class="count" id="c-departments"></span></button>
  </div>
</nav>

<main class="wrap">
  <div id="notice" class="notice" hidden></div>

  <!-- OVERVIEW -->
  <section data-view="overview">
    <div class="stats">
      <div class="stat"><b id="s-dept">0</b><span>Departments</span></div>
      <div class="stat"><b id="s-sport">0</b><span>Sports</span></div>
      <div class="stat"><b id="s-player">0</b><span>Players</span></div>
      <div class="stat"><b id="s-entry">0</b><span>Event entries</span></div>
    </div>
    <div class="panel">
      <h2>Entry board <small>players entered per department, against each sport's quota</small></h2>
      <div class="table-wrap" id="board"></div>
    </div>
  </section>

  <!-- SPORTS -->
  <section data-view="sports" hidden>
    <div class="split">
      <div class="panel">
        <h2 id="sport-form-title">Add sport</h2>
        <form id="sport-form" autocomplete="off">
          <input type="hidden" id="sport-id">
          <label>Sport name<input id="sport-name" required maxlength="60" placeholder="e.g. Cricket, 100 m sprint"></label>
          <div class="row2">
            <label>Format
              <select id="sport-type"><option value="team">Team</option><option value="individual">Individual</option></select>
            </label>
            <label>Quota / dept<input id="sport-quota" type="number" min="0" max="200" value="11" title="0 means no limit"></label>
          </div>
          <label>Venue<input id="sport-venue" maxlength="60" placeholder="e.g. Main ground"></label>
          <label>Date &amp; time<input id="sport-when" type="datetime-local"></label>
          <div class="btns">
            <button class="btn primary" type="submit" id="sport-save">Add sport</button>
            <button class="btn" type="button" id="sport-cancel" hidden>Cancel edit</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>Sports schedule</h2>
        <div class="table-wrap" id="sport-list"></div>
      </div>
    </div>
  </section>

  <!-- PLAYERS -->
  <section data-view="players" hidden>
    <div class="split">
      <div class="panel">
        <h2 id="player-form-title">Register player</h2>
        <form id="player-form" autocomplete="off">
          <input type="hidden" id="player-id">
          <label>Full name<input id="player-name" required maxlength="80"></label>
          <div class="row2">
            <label>Department<select id="player-dept" required></select></label>
            <label>Staff / student ID<input id="player-ref" maxlength="30"></label>
          </div>
          <div class="row2">
            <label>Gender
              <select id="player-gender"><option value="">—</option><option>Female</option><option>Male</option><option>Other</option></select>
            </label>
            <label>Phone<input id="player-phone" type="tel" maxlength="20"></label>
          </div>
          <fieldset>
            <legend>Events</legend>
            <div class="checks" id="player-sports"></div>
          </fieldset>
          <div class="btns">
            <button class="btn primary" type="submit" id="player-save">Register player</button>
            <button class="btn" type="button" id="player-cancel" hidden>Cancel edit</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>Player roster</h2>
        <div class="toolbar">
          <input id="f-search" type="search" placeholder="Search name, bib or ID">
          <select id="f-dept"></select>
          <select id="f-sport"></select>
          <button class="btn" type="button" id="export-csv">Export CSV</button>
        </div>
        <div class="table-wrap" id="player-list"></div>
      </div>
    </div>
  </section>

  <!-- DEPARTMENTS -->
  <section data-view="departments" hidden>
    <div class="split">
      <div class="panel">
        <h2 id="dept-form-title">Add department</h2>
        <form id="dept-form" autocomplete="off">
          <input type="hidden" id="dept-id">
          <label>Department name<input id="dept-name" required maxlength="60" placeholder="e.g. Civil Engineering"></label>
          <div class="row2">
            <label>Short code<input id="dept-code" required maxlength="5" placeholder="CIV" title="Used in bib numbers"></label>
            <label>Captain<input id="dept-captain" maxlength="60"></label>
          </div>
          <div class="btns">
            <button class="btn primary" type="submit" id="dept-save">Add department</button>
            <button class="btn" type="button" id="dept-cancel" hidden>Cancel edit</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>Departments</h2>
        <div class="table-wrap" id="dept-list"></div>
        <div class="btns" id="backup-tools" style="margin-top:14px">
          <button class="btn" type="button" id="export-json">Download backup (JSON)</button>
          <label class="btn" style="display:inline-flex;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);cursor:pointer" id="import-label">
            Restore backup<input type="file" id="import-json" accept="application/json" hidden>
          </label>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";
  const COLS = ["departments", "sports", "players"];
  const LS_KEY = "sportsfest.v1";
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  /* ---------- Storage: shared cloud db when hosted as a claude.ai Artifact, else this browser ---------- */
  const Store = {
    mode: "wait", data: { departments: {}, sports: {}, players: {} }, db: null, downloads: null,
    async init() {
      if (window.claude && typeof window.claude.use === "function") {
        try { this.db = await window.claude.use("db"); } catch (e) { this.db = null; }
        try { this.downloads = await window.claude.use("downloads"); } catch (e) { this.downloads = null; }
      }
      if (this.db) return this.initCloud();
      this.mode = "local";
      try { const raw = localStorage.getItem(LS_KEY); if (raw) Object.assign(this.data, JSON.parse(raw)); } catch (e) {}
      for (const c of COLS) this.data[c] = this.data[c] || {};
      render();
    },
    initCloud() {
      this.mode = "cloud";
      let confirmed = 0;
      const timer = setTimeout(() => notice("The shared database hasn't answered yet. What you see may be out of date.", "warn"), 10000);
      for (const c of COLS) {
        this.db.collection(c).onSnapshot((snap) => {
          const next = {};
          for (const d of snap.docs) next[d.id] = d.data();
          this.data[c] = next;
          if (!snap.metadata.fromCache && ++confirmed >= COLS.length) { clearTimeout(timer); }
          render();
        }, (err) => { clearTimeout(timer); notice("Lost connection to the shared database (" + (err && err.code || "error") + "). Reload the page to reconnect.", "bad"); });
      }
      render();
    },
    persistLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch (e) { notice("This browser blocked saving. Use Download backup to keep your data.", "bad"); } },
    async put(col, id, obj) {
      if (this.mode === "cloud") {
        try { await this.db.collection(col).doc(id).set(obj); }
        catch (e) { notice(writeError(e), "bad"); return false; }
      } else {
        this.data[col] = { ...this.data[col], [id]: obj }; this.persistLocal(); render();
      }
      return true;
    },
    async remove(col, id) {
      if (this.mode === "cloud") {
        try { await this.db.collection(col).doc(id).delete(); }
        catch (e) { notice(writeError(e), "bad"); return false; }
      } else {
        const next = { ...this.data[col] }; delete next[id]; this.data[col] = next; this.persistLocal(); render();
      }
      return true;
    },
    list(col) { return Object.entries(this.data[col] || {}).map(([id, v]) => ({ id, ...v })); },
    get(col, id) { const v = (this.data[col] || {})[id]; return v ? { id, ...v } : null; },
  };
  const writeError = (e) => (e && (e.code === "permission_denied" || e.code === "not_granted"))
    ? "You have view-only access. Ask the organiser for edit access to make changes."
    : "Couldn't save the change (" + (e && e.code || "error") + "). Try again.";

  function notice(msg, kind) {
    const n = $("notice"); n.textContent = msg; n.dataset.kind = kind || "warn"; n.hidden = !msg;
    clearTimeout(notice.t); if (msg && kind === "ok") notice.t = setTimeout(() => { n.hidden = true; }, 3000);
  }

  /* ---------- Derived helpers ---------- */
  const depts = () => Store.list("departments").sort((a, b) => a.name.localeCompare(b.name));
  const sports = () => Store.list("sports").sort((a, b) => (a.when || "~").localeCompare(b.when || "~") || a.name.localeCompare(b.name));
  const players = () => Store.list("players").sort((a, b) => (a.bib || "").localeCompare(b.bib || ""));
  const entries = (deptId, sportId, exceptPlayer) => players().filter((p) => p.deptId === deptId && (p.sportIds || []).includes(sportId) && p.id !== exceptPlayer).length;
  const fmtWhen = (w) => { if (!w) return ""; const d = new Date(w); return isNaN(d) ? w : d.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
  function nextBib(dept) {
    const code = (dept.code || "DEP").toUpperCase();
    let max = 0;
    for (const p of players()) { if (p.deptId === dept.id) { const n = parseInt(String(p.bib || "").split("-")[1], 10); if (n > max) max = n; } }
    return code + "-" + String(max + 1).padStart(3, "0");
  }

  /* ---------- Two-click delete (the viewer blocks confirm dialogs) ---------- */
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-del]");
    document.querySelectorAll("button.armed").forEach((x) => { if (x !== b) { x.classList.remove("armed"); x.textContent = "Delete"; } });
    if (!b) return;
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirm"; return; }
    const [col, id] = b.dataset.del.split(":");
    onDelete(col, id);
  });
  async function onDelete(col, id) {
    if (col === "departments" && players().some((p) => p.deptId === id)) { notice("Move or delete this department's players first.", "bad"); return; }
    if (col === "sports") {
      for (const p of players().filter((p) => (p.sportIds || []).includes(id))) {
        const { id: pid, ...rest } = p; await Store.put("players", pid, { ...rest, sportIds: rest.sportIds.filter((s) => s !== id) });
      }
    }
    if (await Store.remove(col, id)) notice("Deleted.", "ok");
  }

  /* ---------- Tabs ---------- */
  const TABS = ["overview", "sports", "players", "departments"];
  function showTab(name) {
    if (!TABS.includes(name)) name = "overview";
    document.querySelectorAll("[data-view]").forEach((s) => { s.hidden = s.dataset.view !== name; });
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  }
  document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.tab; showTab(b.dataset.tab); }));
  window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));

  /* ---------- Render ---------- */
  function render() {
    const m = $("mode");
    m.className = "mode " + Store.mode;
    m.textContent = Store.mode === "cloud" ? "Shared · live" : Store.mode === "local" ? "Saved in this browser" : "Connecting…";
    $("backup-tools").hidden = Store.mode !== "local";
    const D = depts(), S = sports(), P = players();
    $("c-sports").textContent = S.length || ""; $("c-players").textContent = P.length || ""; $("c-departments").textContent = D.length || "";
    $("s-dept").textContent = D.length; $("s-sport").textContent = S.length; $("s-player").textContent = P.length;
    $("s-entry").textContent = P.reduce((n, p) => n + (p.sportIds || []).length, 0);
    renderBoard(D, S); renderSports(S); renderDepts(D); renderPlayerForm(D, S); renderFilters(D, S); renderPlayers();
  }

  function renderBoard(D, S) {
    if (!D.length || !S.length) {
      $("board").innerHTML = `<div class="empty">Add departments and sports to see the entry board.<br>${!D.length ? "Start in <b>Departments</b>." : "Next, add events in <b>Sports</b>."}</div>`;
      return;
    }
    let h = `<table><thead><tr><th>Sport</th><th class="num">Quota</th>${D.map((d) => `<th class="num" title="${esc(d.name)}">${esc(d.code)}</th>`).join("")}<th class="num">Total</th></tr></thead><tbody>`;
    for (const s of S) {
      let total = 0;
      const cells = D.map((d) => {
        const n = entries(d.id, s.id); total += n;
        const q = +s.quota || 0;
        const cls = !n ? "" : q && n > q ? "over" : q && n === q ? "full" : "ok";
        return `<td class="num"><span class="pill ${cls}">${n}${q ? " / " + q : ""}</span></td>`;
      }).join("");
      h += `<tr><td><b>${esc(s.name)}</b><div class="sport-type">${esc(s.type)}${s.when ? " · " + esc(fmtWhen(s.when)) : ""}</div></td><td class="num">${+s.quota || "∞"}</td>${cells}<td class="num"><b>${total}</b></td></tr>`;
    }
    $("board").innerHTML = h + "</tbody></table>";
  }

  function renderSports(S) {
    if (!S.length) { $("sport-list").innerHTML = `<div class="empty">No sports yet. Add the first event with the form.</div>`; return; }
    const P = players();
    $("sport-list").innerHTML = `<table><thead><tr><th>Sport</th><th>When &amp; where</th><th class="num">Entries</th><th></th></tr></thead><tbody>${S.map((s) => {
      const n = P.filter((p) => (p.sportIds || []).includes(s.id)).length;
      return `<tr><td><b>${esc(s.name)}</b><div class="sport-type">${esc(s.type)} · quota ${+s.quota || "none"}</div></td>
        <td>${esc(fmtWhen(s.when)) || '<span class="muted">Not scheduled</span>'}<div class="muted">${esc(s.venue)}</div></td>
        <td class="num">${n}</td>
        <td class="actions"><button class="btn small" data-edit="sports:${esc(s.id)}">Edit</button> <button class="btn small danger" data-del="sports:${esc(s.id)}">Delete</button></td></tr>`;
    }).join("")}</tbody></table>`;
  }

  function renderDepts(D) {
    if (!D.length) { $("dept-list").innerHTML = `<div class="empty">No departments yet. Add each participating department with a short code such as CIV or MECH.</div>`; return; }
    const P = players();
    $("dept-list").innerHTML = `<table><thead><tr><th>Code</th><th>Department</th><th>Captain</th><th class="num">Players</th><th></th></tr></thead><tbody>${D.map((d) =>
      `<tr><td><span class="bib">${esc(d.code)}</span></td><td>${esc(d.name)}</td><td>${esc(d.captain) || '<span class="muted">—</span>'}</td>
       <td class="num">${P.filter((p) => p.deptId === d.id).length}</td>
       <td class="actions"><button class="btn small" data-edit="departments:${esc(d.id)}">Edit</button> <button class="btn small danger" data-del="departments:${esc(d.id)}">Delete</button></td></tr>`).join("")}</tbody></table>`;
  }

  function renderPlayerForm(D, S) {
    const sel = $("player-dept"), cur = sel.value;
    sel.innerHTML = `<option value="">Choose…</option>` + D.map((d) => `<option value="${esc(d.id)}">${esc(d.code)} · ${esc(d.name)}</option>`).join("");
    sel.value = D.some((d) => d.id === cur) ? cur : "";
    renderPlayerSports(S);
  }
  function renderPlayerSports(S) {
    S = S || sports();
    const box = $("player-sports");
    const checked = new Set([...box.querySelectorAll("input:checked")].map((i) => i.value));
    const deptId = $("player-dept").value, pid = $("player-id").value;
    if (!S.length) { box.innerHTML = `<span class="muted">Add sports first.</span>`; return; }
    box.innerHTML = S.map((s) => {
      const q = +s.quota || 0, n = deptId ? entries(deptId, s.id, pid) : 0;
      const full = q && deptId && n >= q && !checked.has(s.id);
      return `<label class="${full ? "full" : ""}"><input type="checkbox" value="${esc(s.id)}" ${checked.has(s.id) ? "checked" : ""} ${full ? "disabled" : ""}>
        ${esc(s.name)}<span class="q">${deptId ? (q ? `${n}/${q}` : n) : ""}${full ? " full" : ""}</span></label>`;
    }).join("");
  }
  $("player-dept").addEventListener("change", () => renderPlayerSports());

  function renderFilters(D, S) {
    const fd = $("f-dept"), fs = $("f-sport"), vd = fd.value, vs = fs.value;
    fd.innerHTML = `<option value="">All departments</option>` + D.map((d) => `<option value="${esc(d.id)}">${esc(d.code)}</option>`).join("");
    fs.innerHTML = `<option value="">All sports</option>` + S.map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
    fd.value = D.some((d) => d.id === vd) ? vd : ""; fs.value = S.some((s) => s.id === vs) ? vs : "";
  }
  function filteredPlayers() {
    const q = $("f-search").value.trim().toLowerCase(), fd = $("f-dept").value, fs = $("f-sport").value;
    return players().filter((p) => (!fd || p.deptId === fd) && (!fs || (p.sportIds || []).includes(fs)) &&
      (!q || [p.name, p.bib, p.ref].some((v) => String(v || "").toLowerCase().includes(q))));
  }
  function renderPlayers() {
    const all = players();
    if (!all.length) { $("player-list").innerHTML = `<div class="empty">No players registered yet. Each player gets a bib number like CIV-001 when you register them.</div>`; return; }
    const L = filteredPlayers();
    if (!L.length) { $("player-list").innerHTML = `<div class="empty">No players match these filters.</div>`; return; }
    $("player-list").innerHTML = `<table><thead><tr><th>Bib</th><th>Player</th><th>Dept</th><th>Events</th><th></th></tr></thead><tbody>${L.map((p) => {
      const d = Store.get("departments", p.deptId);
      const evs = (p.sportIds || []).map((id) => Store.get("sports", id)).filter(Boolean);
      return `<tr><td><span class="bib">${esc(p.bib)}</span></td>
        <td><b>${esc(p.name)}</b><div class="muted">${[p.ref, p.gender, p.phone].filter(Boolean).map(esc).join(" · ")}</div></td>
        <td>${d ? esc(d.code) : '<span class="muted">?</span>'}</td>
        <td>${evs.length ? evs.map((s) => `<span class="chip">${esc(s.name)}</span>`).join("") : '<span class="muted">None</span>'}</td>
        <td class="actions"><button class="btn small" data-edit="players:${esc(p.id)}">Edit</button> <button class="btn small danger" data-del="players:${esc(p.id)}">Delete</button></td></tr>`;
    }).join("")}</tbody></table>
    <div class="muted" style="margin-top:8px">${L.length} of ${all.length} players</div>`;
  }
  ["f-search", "f-dept", "f-sport"].forEach((id) => $(id).addEventListener("input", renderPlayers));

  /* ---------- Forms ---------- */
  function resetForm(kind) {
    const map = { sports: ["sport", "Add sport"], players: ["player", "Register player"], departments: ["dept", "Add department"] };
    const [p, label] = map[kind];
    $(p + "-form").reset(); $(p + "-id").value = "";
    $(p + "-form-title").textContent = label; $(p + "-save").textContent = label; $(p + "-cancel").hidden = true;
    if (kind === "players") { $("player-sports").querySelectorAll("input").forEach((i) => { i.checked = false; }); renderPlayerSports(); }
  }
  $("sport-cancel").onclick = () => resetForm("sports");
  $("player-cancel").onclick = () => resetForm("players");
  $("dept-cancel").onclick = () => resetForm("departments");

  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-edit]"); if (!b) return;
    const [col, id] = b.dataset.edit.split(":"); const r = Store.get(col, id); if (!r) return;
    if (col === "sports") {
      $("sport-id").value = id; $("sport-name").value = r.name || ""; $("sport-type").value = r.type || "team";
      $("sport-quota").value = r.quota ?? 0; $("sport-venue").value = r.venue || ""; $("sport-when").value = r.when || "";
      $("sport-form-title").textContent = "Edit sport"; $("sport-save").textContent = "Save changes"; $("sport-cancel").hidden = false; $("sport-name").focus();
    } else if (col === "departments") {
      $("dept-id").value = id; $("dept-name").value = r.name || ""; $("dept-code").value = r.code || ""; $("dept-captain").value = r.captain || "";
      $("dept-form-title").textContent = "Edit department"; $("dept-save").textContent = "Save changes"; $("dept-cancel").hidden = false; $("dept-name").focus();
    } else if (col === "players") {
      $("player-id").value = id; $("player-name").value = r.name || ""; $("player-dept").value = r.deptId || "";
      $("player-ref").value = r.ref || ""; $("player-gender").value = r.gender || ""; $("player-phone").value = r.phone || "";
      $("player-sports").querySelectorAll("input").forEach((i) => { i.checked = (r.sportIds || []).includes(i.value); });
      renderPlayerSports();
      $("player-form-title").textContent = "Edit " + (r.bib || "player"); $("player-save").textContent = "Save changes"; $("player-cancel").hidden = false; $("player-name").focus();
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("sport-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const id = $("sport-id").value || uid();
    const name = $("sport-name").value.trim(); if (!name) return;
    if (sports().some((s) => s.id !== id && s.name.toLowerCase() === name.toLowerCase())) { notice(`"${name}" is already on the list.`, "bad"); return; }
    const ok = await Store.put("sports", id, { name, type: $("sport-type").value, quota: Math.max(0, parseInt($("sport-quota").value, 10) || 0),
      venue: $("sport-venue").value.trim(), when: $("sport-when").value });
    if (ok) { notice(`Saved ${name}.`, "ok"); resetForm("sports"); }
  });

  $("dept-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const id = $("dept-id").value || uid();
    const name = $("dept-name").value.trim(), code = $("dept-code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!name || !code) { notice("Give the department a name and a short code using letters or digits.", "bad"); return; }
    if (depts().some((d) => d.id !== id && d.code === code)) { notice(`Code ${code} is already used by another department.`, "bad"); return; }
    const ok = await Store.put("departments", id, { name, code, captain: $("dept-captain").value.trim() });
    if (ok) { notice(`Saved ${name}.`, "ok"); resetForm("departments"); }
  });

  $("player-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const existing = $("player-id").value ? Store.get("players", $("player-id").value) : null;
    const id = existing ? existing.id : uid();
    const name = $("player-name").value.trim(), deptId = $("player-dept").value;
    const dept = Store.get("departments", deptId);
    if (!name || !dept) { notice("Enter the player's name and choose a department.", "bad"); return; }
    const sportIds = [...$("player-sports").querySelectorAll("input:checked")].map((i) => i.value);
    for (const sid of sportIds) {
      const s = Store.get("sports", sid), q = s && +s.quota;
      if (q && entries(deptId, sid, id) >= q) { notice(`${dept.code} already has ${q} players in ${s.name}. Remove one first or raise the quota.`, "bad"); return; }
    }
    const bib = existing && existing.deptId === deptId ? existing.bib : nextBib(dept);
    const ok = await Store.put("players", id, { name, deptId, bib, ref: $("player-ref").value.trim(), gender: $("player-gender").value,
      phone: $("player-phone").value.trim(), sportIds, createdAt: existing ? existing.createdAt || "" : new Date().toISOString() });
    if (ok) { notice(`${existing ? "Updated" : "Registered"} ${name} as ${bib}.`, "ok"); resetForm("players"); }
  });

  /* ---------- Export / backup ---------- */
  async function saveFile(filename, text, type) {
    if (Store.downloads) {
      try { await Store.downloads.save({ filename, data: new Blob([text], { type }) }); } catch (e) { if (e && e.code !== "dismissed") notice("The file wasn't saved.", "warn"); }
      return;
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  const csvCell = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  $("export-csv").onclick = () => {
    const rows = [["Bib", "Name", "Department", "Dept code", "ID", "Gender", "Phone", "Events"]];
    for (const p of filteredPlayers()) {
      const d = Store.get("departments", p.deptId) || {};
      rows.push([p.bib, p.name, d.name, d.code, p.ref, p.gender, p.phone, (p.sportIds || []).map((id) => (Store.get("sports", id) || {}).name).filter(Boolean).join("; ")]);
    }
    saveFile("festival-players.csv", rows.map((r) => r.map(csvCell).join(",")).join("\n"), "text/csv");
  };
  $("export-json").onclick = () => saveFile("festival-backup.json", JSON.stringify(Store.data, null, 2), "application/json");
  $("import-json").addEventListener("change", async (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const obj = JSON.parse(await f.text());
      if (!COLS.every((c) => obj[c] && typeof obj[c] === "object")) throw new Error("shape");
      for (const c of COLS) Store.data[c] = obj[c];
      Store.persistLocal(); render(); notice("Backup restored.", "ok");
    } catch (e) { notice("That file isn't a festival backup.", "bad"); }
    ev.target.value = "";
  });

  showTab(location.hash.slice(1));
  render();
  Store.init();
})();
</script>
