name: Deploy Sports Festival app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["sports-festival/**", "cricket/**", "progress/**", ".github/workflows/sports-festival-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        run: |
          mkdir -p _site
          # Firebase config: the FIREBASE_CONFIG repository variable (a JSON object) wins over the committed file.
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf 'window.FIREBASE_CONFIG = %s;\n' "$FIREBASE_CONFIG" > _site/firebase-config.js
          else
            cp sports-festival/firebase-config.js _site/firebase-config.js
          fi
          # Player guide (PDF + one image per language) published under /guide/
          mkdir -p _site/guide
          cp sports-festival/docs/propose-guide.pdf sports-festival/docs/propose-guide-*.png _site/guide/
          # Version stamp: the app compares it with version.json (fetched past the cache) and reloads if it is out of date.
          VERSION="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          printf '{"v":"%s"}\n' "$VERSION" > _site/version.json
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            echo '<meta http-equiv="Cache-Control" content="no-cache">'
            echo "<script>window.APP_VERSION = \"$VERSION\";</script>"
            echo "<script src=\"firebase-config.js?v=$VERSION\"></script></head><body>"
            cat sports-festival/app.html
            echo '</body></html>'
          } > _site/index.html
          # Cricket scoring app: its own page at /cricket/, same Firebase project (cr_* collections)
          mkdir -p _site/cricket
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            echo '<meta http-equiv="Cache-Control" content="no-cache">'
            echo "<script>window.APP_VERSION = \"$VERSION\";</script>"
            echo "<script src=\"../firebase-config.js?v=$VERSION\"></script></head><body>"
            cat cricket/app.html
            echo '</body></html>'
          } > _site/cricket/index.html
          # Public live page (read-only, no sign-in): same app with CRICKET_PUBLIC set; can be paused in Settings
          mkdir -p _site/cricket/live
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            echo '<meta http-equiv="Cache-Control" content="no-cache">'
            echo '<script>window.CRICKET_PUBLIC = true;</script>'
            echo "<script>window.APP_VERSION = \"$VERSION\";</script>"
            echo "<script src=\"../../firebase-config.js?v=$VERSION\"></script></head><body>"
            cat cricket/app.html
            echo '</body></html>'
          } > _site/cricket/live/index.html
          # Post-match entry page (/cricket_post/): same app with CRICKET_POST set, for entering totals from the score sheet
          mkdir -p _site/cricket_post
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            echo '<meta http-equiv="Cache-Control" content="no-cache">'
            echo '<script>window.CRICKET_POST = true;</script>'
            echo "<script>window.APP_VERSION = \"$VERSION\";</script>"
            echo "<script src=\"../firebase-config.js?v=$VERSION\"></script></head><body>"
            cat cricket/app.html
            echo '</body></html>'
          } > _site/cricket_post/index.html
          # Festival progress: editor at /progress/, public view at /progress/live/ (pg_* collections)
          for P in progress progress/live; do
            mkdir -p _site/$P
            UP=$( [ "$P" = "progress" ] && echo "../" || echo "../../" )
            {
              echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
              echo '<meta http-equiv="Cache-Control" content="no-cache">'
              [ "$P" = "progress/live" ] && echo '<script>window.PROGRESS_PUBLIC = true;</script>'
              echo "<script>window.APP_VERSION = \"$VERSION\";</script>"
              echo "<script src=\"${UP}firebase-config.js?v=$VERSION\"></script></head><body>"
              cat progress/app.html
              echo '</body></html>'
            } > _site/$P/index.html
          done
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
