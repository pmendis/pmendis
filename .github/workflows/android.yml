# Checks the Flutter app and builds an installable Android APK.
# The APK is attached to each run as the "lanka-maps-apk" artifact.
name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        # Set the API_BASE_URL repository variable to bake in a default server;
        # it can always be changed in the app under Settings → Map server.
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8080' }}

      - name: Name the APK
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "lanka-maps-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lanka-maps-apk
          path: apps/mobile/lanka-maps-*.apk
          if-no-files-found: error
