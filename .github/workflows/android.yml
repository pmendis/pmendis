# Checks the Flutter app and builds an installable Android APK.
# The APK is attached to each run as the "lanka-maps-apk" artifact.
name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        # Set the API_BASE_URL repository variable to bake in a default server;
        # it can always be changed in the app under Settings → Map server.
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8080' }}

      - name: Name the APK
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "lanka-maps-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lanka-maps-apk
          path: apps/mobile/lanka-maps-*.apk
          if-no-files-found: error

  # Launches the APK on an Android emulator and checks it gets past the
  # splash screen. The screen text and app log are printed in the job log.
  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lanka-maps-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: OUT_DIR=smoke-test apps/mobile/tool/android_smoke_test.sh "$(ls apk/*.apk)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-test
          path: smoke-test/

  # Publishes the APK as a GitHub pre-release once it has started on the
  # emulator, so it can be downloaded directly (no zip, no sign-in).
  publish-apk:
    needs: [build, emulator-smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lanka-maps-apk
          path: apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lanka Maps build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: apk/*.apk
          body: |
            Test build from commit ${{ github.sha }} (`${{ github.ref_name }}`).
            Debug-signed: fine for installing directly on a phone, not for the Play Store.

            After installing, set your server under **Settings → Map server**
            (or tap **Change server** on the error screen), e.g. `http://192.168.1.20:8080`.
