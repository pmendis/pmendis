; Ender 3 V2 display-port sniffer
;
; Listens to the traffic between the printer mainboard and the stock DWIN
; screen, plus the rotary knob and buzzer lines, and prints a decoded,
; timestamped log over USB. It never drives any printer line.
;
;   pio run -e esp32s3 -t upload      (ESP32-S3-DevKitC-1, default)
;   pio run -e esp32dev -t upload     (classic ESP32 DevKit)
;   python3 tools/capture.py <port>   (save a log file)

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.9.0
framework = arduino
build_flags = -Wall

[env:esp32s3]
board = esp32-s3-devkitc-1
; Serial = the board's native USB port (USB-Serial/JTAG). Baud is ignored.
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

[env:esp32dev]
board = esp32dev
; Serial = UART0 through the board's USB-UART chip.
monitor_speed = 921600
